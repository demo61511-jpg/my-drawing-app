name: Build and Publish Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          java -version
          echo "JAVA_HOME: $JAVA_HOME"
          JAVA_VER=$(java -version 2>&1 | head -n 1 | awk -F '"' '{print $2}' | awk -F '.' '{print $1}')
          echo "Detected Java Major Version: $JAVA_VER"
          if [ -z "$JAVA_VER" ]; then
            echo "Error: Unable to detect Java version."
            exit 1
          fi
          if [ "$JAVA_VER" -lt 17 ]; then
            echo "Error: Java version must be 17 or higher. Found version: $JAVA_VER"
            exit 1
          fi
          echo "Java 17+ environment verified successfully."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ -f "./debug.keystore" ]; then
            echo "Debug keystore already exists."
          else
            echo "Generating temporary debug keystore..."
            keytool -genkey -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          if [ ! -f "./debug.keystore" ]; then
            echo "Error: Failed to create ./debug.keystore"
            exit 1
          fi
          echo "Temporary debug keystore created successfully."

      - name: Build debug APK
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "Error: Expected APK not found at $APK_PATH"
            echo "Searching only inside app/build/outputs/apk:"
            find app/build/outputs/apk -name "*.apk" 2>/dev/null || true
            exit 1
          fi
          if [ ! -s "$APK_PATH" ]; then
            echo "Error: $APK_PATH is empty."
            exit 1
          fi
          echo "Verified APK at $APK_PATH successfully."

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          TMP_DIR=$(mktemp -d)
          RAW_REPO="${GITHUB_REPOSITORY##*/}"
          SANITIZED_REPO=$(echo "$RAW_REPO" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9._-]/-/g')
          ASSET_NAME="${SANITIZED_REPO}-debug-build-${GITHUB_RUN_NUMBER}.apk"
          TARGET_PATH="$TMP_DIR/$ASSET_NAME"
          cp app/build/outputs/apk/debug/app-debug.apk "$TARGET_PATH"
          if [ ! -f "$TARGET_PATH" ] || [ ! -s "$TARGET_PATH" ]; then
            echo "Error: Failed to prepare APK release asset at $TARGET_PATH"
            exit 1
          fi
          echo "asset_path=$TARGET_PATH" >> $GITHUB_OUTPUT
          echo "asset_name=$ASSET_NAME" >> $GITHUB_OUTPUT
          echo "Prepared release asset: $TARGET_PATH"

      - name: Publish APK to GitHub Releases
        id: release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version
          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "Error: Release asset missing or empty before release publication."
            exit 1
          fi

          TAG_NAME="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"

          echo "Publishing release with tag: $TAG_NAME"
          gh release create "$TAG_NAME" "$ASSET_PATH" \
            --title "$RELEASE_TITLE" \
            --target "$GITHUB_SHA" \
            --latest \
            --notes "### Automatically Generated Debug APK
  - **Runner**: GitHub Actions
  - **Run Number**: #${GITHUB_RUN_NUMBER}
  - **Run Attempt**: ${GITHUB_RUN_ATTEMPT}
  - **Source Commit**: \`${GITHUB_SHA}\`
  - **Notice**: This APK is intended for testing and development only. It is signed with a temporary debug keystore and is not a Play Store production release."

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.release.outcome }}" = "success" ]; then
            TAG_NAME="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
            RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"
            RELEASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG_NAME}"
            ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"

            echo "=== Release Publication Succeeded ==="
            echo "Release Tag: $TAG_NAME"
            echo "Release Title: $RELEASE_TITLE"
            echo "Release URL: $RELEASE_URL"
            echo "Asset Filename: $ASSET_NAME"
            gh release view "$TAG_NAME" || true

            echo "## GitHub Release Published" >> $GITHUB_STEP_SUMMARY
            echo "**Release URL**: [$RELEASE_URL]($RELEASE_URL)" >> $GITHUB_STEP_SUMMARY
            echo "**APK Asset**: \`$ASSET_NAME\`" >> $GITHUB_STEP_SUMMARY
            echo "The APK is available to download directly from the release Assets section." >> $GITHUB_STEP_SUMMARY
            echo "The normal Actions artifact \`app-debug-apk\` is also available as a backup." >> $GITHUB_STEP_SUMMARY
          else
            echo "::warning ::Release publishing failed or was skipped."
            echo "If the build succeeded, the APK artifact named 'app-debug-apk' remains safely available in GitHub Actions artifacts."

            echo "## Release Warning" >> $GITHUB_STEP_SUMMARY
            echo "⚠️ GitHub Release publishing encountered an issue or was skipped." >> $GITHUB_STEP_SUMMARY
            echo "The debug APK build succeeded and the backup Actions artifact \`app-debug-apk\` remains fully available on this workflow run." >> $GITHUB_STEP_SUMMARY
          fi
